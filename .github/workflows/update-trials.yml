name: Update trial data

on:
  schedule:
    - cron: "23 9 * * *"     # daily, 09:23 UTC = 4:23 am Toronto in winter, 5:23 am in summer
  workflow_dispatch: {}       # can also be run by hand from the Actions tab
  push:
    branches: [main]
    paths:
      - ".github/build_trials.py"
      - ".github/eu_registries.py"
      - ".github/workflows/update-trials.yml"

permissions:
  contents: write

concurrency:
  group: update-trials
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Download open studies for France, Germany, Italy, Spain and the UK from ClinicalTrials.gov, EU CTIS and ISRCTN
        id: build
        continue-on-error: true    # still save the logs if a download fails
        run: |
          ok=0
          for pair in "fr:France" "de:Germany" "it:Italy" "es:Spain" "uk:United Kingdom"; do
            code="${pair%%:*}"; name="${pair#*:}"
            echo "::group::$name"
            TRIAL_COUNTRY="$name" TRIAL_OUT="$code" python3 .github/build_trials.py || ok=1
            echo "::endgroup::"
          done
          exit $ok

      - name: Save the update
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add data
          if git diff --cached --quiet; then
            echo "No change to the trial data"
          else
            if [ "${{ steps.build.outcome }}" = "success" ]; then msg="Trial data update $(date -u +%F)"; else msg="Trial data update failed $(date -u +%F) (log only)"; fi
            git commit -m "$msg"
            git pull --rebase -X theirs origin main
            git push
          fi

      - name: Report a failed download
        if: steps.build.outcome != 'success'
        run: |
          cat data/*/build-log.txt
          exit 1
